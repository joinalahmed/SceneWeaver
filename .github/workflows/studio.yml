name: Studio
on:
  push:
    branches: [main]
    paths:
      [
        "studio/**",
        "packages/react/**",
        "scripts/validate-studio-assets.mjs",
        ".github/workflows/studio.yml",
      ]
  pull_request:
    paths:
      [
        "studio/**",
        "packages/react/**",
        "scripts/validate-studio-assets.mjs",
        ".github/workflows/studio.yml",
      ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate projects, geometry and exports
        run: |
          node --test studio/tests/*.test.mjs
          node scripts/validate-studio-assets.mjs
      - name: Build and test the React package
        run: |
          npm ci --prefix packages/react
          npm test --prefix packages/react
          npm run test:package --prefix packages/react
      - name: Install browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/studio-tests" --no-package-lock --ignore-scripts playwright@1.65.1
          "$RUNNER_TEMP/studio-tests/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify browser interactions and responsive layouts
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/studio-tests/node_modules/playwright
          STUDIO_TEST_OUTPUT: ${{ runner.temp }}/studio-artifacts
        run: |
          python3 -m http.server 5173 --bind 127.0.0.1 > "$RUNNER_TEMP/studio-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node studio/tests/browser.mjs
          for react_version in 18.3.1 19.3.1; do
            npm install --prefix packages/react --no-save --package-lock=false "react@$react_version" "react-dom@$react_version"
            npm run build:example --prefix packages/react
            npm run test:browser --prefix packages/react
          done
      - uses: actions/upload-pages-artifact@v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: studio
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish Studio
        id: deployment
        uses: actions/deploy-pages@v5.0.1
